# ~/.tmux.conf - Managed by OMEN Terminal
# Manual session use only; never auto-started.

# Change prefix from C-b to C-a (optional/ergonomic)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quality of Life
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keybindings
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Catppuccin Mocha colors for tmux
set -g status-position bottom
set -g status-style bg="#181825",fg="#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#181825] "
set -g status-right "#[fg=#cba6f7] %Y-%m-%d #[fg=#89dceb] %H:%M #[bg=#b4befe,fg=#11111b,bold] #h "
set -g status-left-length 40
set -g status-right-length 80

setw -g window-status-current-style bg="#cba6f7",fg="#11111b,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style bg="#1e1e2e",fg="#bac2de"
setw -g window-status-format " #I:#W#F "

set -g pane-border-style fg="#313244"
set -g pane-active-border-style fg="#b4befe"

